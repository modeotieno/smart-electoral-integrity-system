<body style="margin: 0; background-color: #071426;">
  <script>
    // Register custom Service Worker for Chrome PWA installability
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (registration) {
          console.log('SEIS PWA ServiceWorker registered with scope: ', registration.scope);
        }).catch(function (err) {
          console.warn('SEIS ServiceWorker registration failed: ', err);
        });
