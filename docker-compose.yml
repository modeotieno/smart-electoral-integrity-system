services:
  postgres:
    image: postgres:16
    container_name: seis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: seis_db
      POSTGRES_USER: seis_user
      POSTGRES_PASSWORD: seis_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seis_user -d seis_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://seis_user:seis_password@postgres:5432/seis_db?sslmode=disable
      PORT: 8080
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET: seis-ultra-secure-jwt-change-me
      GIN_MODE: release
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: seis-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8080

volumes:
  postgres_data:
