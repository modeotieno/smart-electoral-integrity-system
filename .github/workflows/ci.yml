name: SEIS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: seis_db
          POSTGRES_USER: seis_user
          POSTGRES_PASSWORD: seis_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seis_user -d seis_db"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Go vet
        working-directory: backend
        run: go vet ./...

      - name: Unit tests
        working-directory: backend
        run: go test ./... -v -count=1

      - name: Init DB schema
        env:
          PGPASSWORD: seis_password
        run: |
          psql -h localhost -U seis_user -d seis_db -f database/schema.sql
          psql -h localhost -U seis_user -d seis_db -c "SELECT count(*) FROM elections;" || true

      - name: Integration tests (live DB)
        working-directory: backend
        env:
          DATABASE_URL: postgres://seis_user:seis_password@localhost:5432/seis_db?sslmode=disable
          JWT_SECRET: ci-test-secret-32chars-long-enough
        run: go test -tags=integration ./handlers -run TestLiveAPI -v -count=1

      - name: Build backend
        working-directory: backend
        run: CGO_ENABLED=0 go build -o /tmp/seis .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8080
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate dev compose
        run: docker compose config

      - name: Validate prod compose
        env:
          CORS_ORIGINS: http://localhost:5173
          JWT_SECRET: ci-dummy-32chars-long-enough
          VITE_API_URL: http://localhost:8080
          POSTGRES_PASSWORD: dummy-pass
        run: |
          touch .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config

      - name: Build images (no push)
        run: |
          docker compose build backend frontend
          echo "docker builds OK"
